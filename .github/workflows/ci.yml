name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout · Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Set up Python · Thiết lập Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources · Biên dịch mã Python
        run: python -m py_compile app.py
