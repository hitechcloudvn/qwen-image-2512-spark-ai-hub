name: Publish Image · Đăng ảnh

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/hitechcloudvn/qwen-image-2512-spark-ai-hub

jobs:
  docker:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout · Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Set up Buildx · Thiết lập Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR · Đăng nhập GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata · Siêu dữ liệu Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and push · Build và đẩy ảnh
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
